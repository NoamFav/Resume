<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="preload"
            href="/fonts/VictorMono-Regular.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <!-- Colorscheme before first paint, so a returning visitor on "paper"
             never sees a flash of "night". Same key the scheme switcher writes. -->
        <script>
            (function () {
                var s;
                try { s = localStorage.getItem("nf-scheme"); } catch (e) {}
                if (s !== "night" && s !== "paper" && s !== "amber") {
                    s = matchMedia("(prefers-color-scheme: light)").matches ? "paper" : "night";
                }
                document.documentElement.dataset.scheme = s;
            })();
        </script>

        <title>Noam Favier — Software Engineer &amp; Data Scientist</title>
        <meta
            name="description"
            content="Portfolio and resume of Noam Favier, a software developer specializing in systems programming, AI-driven tools, and interactive applications."
        />
        <meta name="author" content="Noam Favier" />

        <meta property="og:type" content="website" />
        <meta property="og:title" content="Noam Favier — Software Engineer & Data Scientist" />
        <meta
            property="og:description"
            content="Portfolio and resume of Noam Favier, a software developer specializing in systems programming, AI-driven tools, and interactive applications."
        />

        <meta name="theme-color" content="rgb(10,11,13)" />
    </head>

    </body>
</html>
